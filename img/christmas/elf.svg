<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 130">
    <!--
        Original Christmas elf illustration (Becca's Cakes and Bakes).
        Designed to sit on the top edge of a box: the "seat" line is y=96,
        so position it with top = -(width x 0.96) relative to the box's outer edge.
        Legs swing gently; animation is disabled for reduced-motion users.
    -->
    <style>
        .leg { transform-box: fill-box; transform-origin: top center; animation: swing 2.4s ease-in-out infinite; }
        .leg--r { animation-delay: -1.2s; }
        @keyframes swing { 0%, 100% { transform: rotate(-9deg); } 50% { transform: rotate(9deg); } }
        @media (prefers-reduced-motion: reduce) { .leg { animation: none; } }
    </style>
    <defs>
        <pattern id="elfStripe" width="8" height="6" patternUnits="userSpaceOnUse">
            <rect width="8" height="3" fill="#ffffff" />
            <rect y="3" width="8" height="3" fill="#c8102e" />
        </pattern>
    </defs>
    <!-- arms resting on the box -->
    <path d="M39 70 Q30 80 29 94" stroke="#1e7b3c" stroke-width="6" stroke-linecap="round" fill="none" />
    <path d="M61 70 Q70 80 71 94" stroke="#1e7b3c" stroke-width="6" stroke-linecap="round" fill="none" />
    <circle cx="29" cy="95" r="3.6" fill="#f6d5b8" />
    <circle cx="71" cy="95" r="3.6" fill="#f6d5b8" />
    <!-- tunic -->
    <path d="M38 66 L62 66 L69 97 L31 97 Z" fill="#1e7b3c" />
    <path d="M36 64 L64 64 L61 72 L57 67.5 L53.5 72.5 L50 67.5 L46.5 72.5 L43 67.5 L39 72 Z" fill="#c8102e" />
    <rect x="33.5" y="85" width="33" height="5" fill="#2a1a2e" />
    <rect x="47" y="84" width="6" height="7" rx="1" fill="none" stroke="#e2c27a" stroke-width="1.6" />
    <!-- dangling legs -->
    <g class="leg">
        <rect x="40" y="95" width="7" height="22" fill="url(#elfStripe)" />
        <path d="M38 116 L48 116 L48 123 L42 123 Q34 123 33 117" fill="#c8102e" />
        <circle cx="33" cy="116.5" r="2" fill="#e2c27a" />
    </g>
    <g class="leg leg--r">
        <rect x="53" y="95" width="7" height="22" fill="url(#elfStripe)" />
        <path d="M52 116 L62 116 Q66 123 58 123 L52 123 Z" fill="#c8102e" />
        <path d="M60 120 Q67 121 67 116" stroke="#c8102e" stroke-width="3" stroke-linecap="round" fill="none" />
        <circle cx="67" cy="116" r="2" fill="#e2c27a" />
    </g>
    <!-- ears + head -->
    <path d="M36 50 L24 43 L35 58 Z" fill="#f2c4a0" />
    <path d="M64 50 L76 43 L65 58 Z" fill="#f2c4a0" />
    <circle cx="50" cy="52" r="15" fill="#f6d5b8" />
    <circle cx="44.5" cy="51" r="1.9" fill="#2a1a2e" />
    <circle cx="55.5" cy="51" r="1.9" fill="#2a1a2e" />
    <circle cx="40.5" cy="57" r="2.6" fill="#f29a9a" opacity="0.7" />
    <circle cx="59.5" cy="57" r="2.6" fill="#f29a9a" opacity="0.7" />
    <path d="M45.5 58 Q50 62.5 54.5 58" stroke="#2a1a2e" stroke-width="1.6" stroke-linecap="round" fill="none" />
    <!-- hat -->
    <path d="M34 42 Q38 12 70 5 Q62 20 66 42 Z" fill="#c8102e" />
    <rect x="31" y="36" width="38" height="8" rx="4" fill="#ffffff" />
    <circle cx="71" cy="5.5" r="5" fill="#ffffff" />
</svg>
